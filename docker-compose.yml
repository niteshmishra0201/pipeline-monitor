
services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pipeline_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pipeline_monitor
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_ENABLED: ${SLACK_ENABLED}
      FAILURE_ALERT_THRESHOLD: ${FAILURE_ALERT_THRESHOLD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

  celery:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/pipeline_monitor
      REDIS_URL: redis://redis:6379/0
      GROQ_API_KEY: ${GROQ_API_KEY}
      LLM_MODEL: ${LLM_MODEL}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
      SLACK_ENABLED: ${SLACK_ENABLED}
      FAILURE_ALERT_THRESHOLD: ${FAILURE_ALERT_THRESHOLD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data: