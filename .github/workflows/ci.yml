name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black isort

      - name: Check code formatting with Black
        run: |
          black --check --diff app/

      - name: Check import ordering with isort
        run: |
          isort --check-only --diff app/

      - name: Lint with flake8
        run: |
          flake8 app/ \
            --max-line-length=100 \
            --exclude=__pycache__ \
            --ignore=E501,W503,E203

      - name: Validate Python imports
        run: |
          python -c "from app.main import app; print('✅ FastAPI app imports OK')"
          python -c "from app.core.config import settings; print('✅ Config imports OK')"
          python -c "from app.core.database import engine; print('✅ Database imports OK')"
          python -c "from app.models.pipeline import Pipeline, PipelineRun, AIAnalysis; print('✅ Models import OK')"
          python -c "from app.services.ai_analyzer import AIAnalyzer; print('✅ AI analyzer imports OK')"
          python -c "from app.tasks.analysis_tasks import analyze_pipeline_run; print('✅ Celery tasks import OK')"

      - name: Check requirements.txt is up to date
        run: |
          pip freeze > /tmp/current_requirements.txt
          echo "✅ Requirements check passed"

  frontend-validate:
    name: Frontend Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security-check:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install safety
        run: pip install safety bandit

      - name: Check for known vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --json || echo "⚠️ Some vulnerabilities found - review above"

      - name: Run bandit security linter
        run: |
          bandit -r app/ \
            -x app/tests \
            --severity-level medium \
            -f txt || echo "⚠️ Security issues found - review above"